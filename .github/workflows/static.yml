
name: Build and Deploy World Tycoon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack and build game
        run: |
          mkdir project
          unzip -q World_Tycoon_Android_Starter.zip -d project
          GAME_DIR=$(dirname "$(find project -name package.json -print -quit)")
          if [ ! -f "$GAME_DIR/package.json" ]; then
            echo "Could not find package.json"
            exit 1
          fi
          npm --prefix "$GAME_DIR" install
          npm --prefix "$GAME_DIR" run build -- --base=/World-Owners/
          mkdir site
          cp -R "$GAME_DIR/dist/." site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
