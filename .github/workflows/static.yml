name: Deploy World Tycoon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build game
        run: |
          mkdir project
          unzip -q World_Tycoon_Android_Starter.zip -d project
          GAME_DIR=$(dirname "$(find project -name package.json -print -quit)")
          cd "$GAME_DIR"
          npm install
          npm run build -- --base=/World-Owners/
          cd -
          touch "$GAME_DIR/dist/.nojekyll"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/world_tycoon_android_starter/dist

      - name: Publish game
        uses: actions/deploy-pages@v4
