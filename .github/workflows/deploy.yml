name: Build and Deploy World Tycoon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack game
        run: unzip -q World_Tycoon_Android_Starter.zip -d project

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build game
        working-directory: project
        run: npm run build -- --base=/World-Owners/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
