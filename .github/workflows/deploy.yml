
name: Build and Deploy World Tycoon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack game
        run: |
          mkdir -p project
          unzip -q World_Tycoon_Android_Starter.zip -d project
          GAME_DIR="$(dirname "$(find project -name package.json -print -quit)")"
          if [ "$GAME_DIR" = "project" ] || [ ! -f "$GAME_DIR/package.json" ]; then
            echo "Could not find package.json"
            exit 1
          fi
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

      - name: Install and build
        run: |
          npm install
          npm run build
        working-directory: project/world_tycoon_android_starter

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/world_tycoon_android_starter/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
      
